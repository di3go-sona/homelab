- name: Ensure systemd-timesyncd is enabled and synced
  become: yes
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted
    enabled: yes

- name: Update all packages to the latest version
  become: yes
  ansible.builtin.apt:
    update_cache: yes
    upgrade: full
  register: update_result

- name: Read /boot/firmware/cmdline.txt
  become: yes
  ansible.builtin.slurp:
    path: /boot/firmware/cmdline.txt
  register: cmdline_content

- name: Enable memory cgroups
  become: yes
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: yes
    line: '\1 cgroup_enable=memory cgroup_memory=1'
    regexp: '(.*)'
  when: "'cgroup_enable=memory' not in (cmdline_content.content | b64decode)"
  register: cgroup_update_result

- name: Reboot if updates were installed
  become: yes
  ansible.builtin.reboot:
    msg: "Rebooting after updates"
    connect_timeout: 5
    reboot_timeout: 600
  when: update_result.changed or cgroup_update_result.changed

- name: Ensure required packages are installed
  become: yes
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - vim
      - python3
      - nfs-common

- name: Ensure CNI bin directory exists
  become: yes
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: '0755'

- name: Check if macvlan CNI plugin is installed
  become: yes
  ansible.builtin.stat:
    path: /opt/cni/bin/macvlan
  register: macvlan_binary

- name: Download and install CNI plugins
  become: yes
  ansible.builtin.unarchive:
    src: https://github.com/containernetworking/plugins/releases/download/v1.5.1/cni-plugins-linux-arm64-v1.5.1.tgz
    dest: /opt/cni/bin/
    remote_src: yes
    extra_opts:
      - './macvlan'
      - './bridge'
      - './dhcp'
      - './static'
      - './host-local'
      - './portmap'
  when: not macvlan_binary.stat.exists