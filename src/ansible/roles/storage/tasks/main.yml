- name: Create mount point directories
  become: yes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
  loop: "{{ host_mounts[inventory_hostname] | default([]) }}"

- name: Mount volumes
  become: yes
  ansible.posix.mount:
    src: "UUID={{ item.uuid }}"
    path: "{{ item.path }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts | default('defaults') }}"
    state: mounted
  loop: "{{ host_mounts[inventory_hostname] | default([]) }}"

- name: Install NFS server (Debian)
  become: yes
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: yes
  when:
    - ansible_os_family == "Debian"
    - host_mounts[inventory_hostname] | default([]) | selectattr('nfs_export', 'defined') | selectattr('nfs_export') | list | length > 0

- name: Install NFS server (Arch)
  become: yes
  ansible.builtin.package:
    name: nfs-utils
    state: present
  when:
    - ansible_os_family == "Archlinux"
    - host_mounts[inventory_hostname] | default([]) | selectattr('nfs_export', 'defined') | selectattr('nfs_export') | list | length > 0

- name: Configure NFS exports
  become: yes
  ansible.builtin.lineinfile:
    path: /etc/exports
    regexp: "^{{ item.path }}\\s"
    line: "{{ item.path }} {{ item.nfs_clients | default('*(rw,sync,no_subtree_check,no_root_squash)') }}"
    state: present
  loop: "{{ host_mounts[inventory_hostname] | default([]) }}"
  when: item.nfs_export | default(false)
  notify: Reload NFS exports

- name: Ensure NFS server is running
  become: yes
  ansible.builtin.systemd:
    name: "{{ 'nfs-kernel-server' if ansible_os_family == 'Debian' else 'nfs-server' }}"
    state: started
    enabled: yes
  when: host_mounts[inventory_hostname] | default([]) | selectattr('nfs_export', 'defined') | selectattr('nfs_export') | list | length > 0
