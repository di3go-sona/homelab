apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/di3go-sona/homelab.git
        revision: main
        directories:
          - path: src/argo/apps/*
  template:
    metadata:
      name: '{{path.basename}}-root'
    spec:
      project: default
      source:
        repoURL: https://github.com/di3go-sona/homelab.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
          - CreateNamespace=true
  syncPolicy:
    preserveResourcesOnDeletion: false
