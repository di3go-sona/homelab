apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-di3go-sona-dev
  namespace: cert-manager
spec:
  secretName: lab-di3go-sona-dev-tls
  dnsNames:
    - lab.di3go-sona.dev
    - '*.lab.di3go-sona.dev'
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "argocd,dashy,media,homeassistant,esphome,openclaw"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
