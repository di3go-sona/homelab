apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.15.5
    helm:
      parameters:
        - name: kubeProxyReplacement
          value: "true"
        - name: k8sServiceHost
          value: "192.168.8.15"
        - name: k8sServicePort
          value: "6443"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
