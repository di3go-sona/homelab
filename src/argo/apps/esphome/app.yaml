apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: esphome
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/di3go-sona/homelab.git
    targetRevision: main
    path: src/argo/apps/esphome/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: esphome
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
