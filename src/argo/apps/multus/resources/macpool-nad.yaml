apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macpool
  namespace: multus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    description: "Use IPs 192.168.8.80-99/24 in pod annotations"
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "macpool",
      "type": "macvlan",
      "master": "eth0",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }
