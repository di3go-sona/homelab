apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-money-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/di3go-sona/open-money-tracker.git
    targetRevision: main
    path: charts/open-money-tracker
    helm:
      parameters:
        - name: imagePullSecrets[0].name
          value: ghcr-pull
        - name: postgresql.storageClassName
          value: nfs-csi
        - name: import.persistence.storageClassName
          value: nfs-csi
        - name: ingress.className
          value: cilium
        - name: ingress.host
          value: money.patat.in
  destination:
    server: https://kubernetes.default.svc
    namespace: open-money-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
