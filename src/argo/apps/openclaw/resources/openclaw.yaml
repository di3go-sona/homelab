apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-config
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      initContainers:
        - name: install-gog
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /config/bin
              if [ ! -f /config/bin/gog ]; then
                ARCH=arm64
                curl -fsSL "https://github.com/openclaw/gogcli/releases/download/v0.33.0/gogcli_0.33.0_linux_${ARCH}.tar.gz" | tar xz -C /tmp
                mv /tmp/gog /config/bin/gog
                chmod +x /config/bin/gog
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          ports:
            - containerPort: 18789
          env:
            - name: GOG_KEYRING_PASSWORD
              value: ""
            - name: GOG_HOME
              value: /home/node/.openclaw/adapters/gog
            - name: TZ
              value: Europe/Rome
            - name: PATH
              value: /home/node/.openclaw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-gateway-token
                  key: token
          command:
            - node
            - openclaw.mjs
            - gateway
            - --bind
            - lan
            - --port
            - "18789"
          volumeMounts:
            - name: config
              mountPath: /home/node/.openclaw
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: openclaw-config
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  selector:
    app: openclaw
  ports:
    - port: 80
      targetPort: 18789
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    ingress.cilium.io/force-https: "disabled"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - openclaw.patat.in
      secretName: wildcard-patat-in-tls
  rules:
    - host: openclaw.patat.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw
                port:
                  number: 80
