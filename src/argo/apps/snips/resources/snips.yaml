apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snips-data
  namespace: snips
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snips
  namespace: snips
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snips
  template:
    metadata:
      labels:
        app: snips
    spec:
      containers:
        - name: snips
          image: ghcr.io/robherley/snips.sh:latest
          ports:
            - containerPort: 8080
            - containerPort: 2222
          env:
            - name: SNIPS_HTTP_EXTERNAL
              value: "http://paste.patat.in"
            - name: SNIPS_SSH_EXTERNAL
              value: "ssh://paste.patat.in:22"
            - name: SNIPS_HMACKEY
              value: "changeme"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: snips-data
---
apiVersion: v1
kind: Service
metadata:
  name: snips-http
  namespace: snips
spec:
  selector:
    app: snips
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: snips-ssh
  namespace: snips
spec:
  type: LoadBalancer
  selector:
    app: snips
  ports:
    - port: 22
      targetPort: 2222
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snips
  namespace: snips
  annotations:
    ingress.cilium.io/force-https: "disabled"
spec:
  ingressClassName: cilium
  rules:
    - host: paste.patat.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snips-http
                port:
                  number: 80
